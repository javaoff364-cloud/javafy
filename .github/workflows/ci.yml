name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm install
      - name: TypeScript build
        run: npm run build
      - name: Unit and integration tests
        run: npm test
      - name: Package contents and installation metadata
        run: npm run test:packages
      - name: Example typecheck
        run: npm run typecheck:example
      - name: Example production build
        run: npm run build:example
      - name: Production fullstack smoke tests
        run: node scripts/verify-production.mjs
      - name: Performance baseline
        run: npm run benchmark > benchmark-results.json
      - name: Dependency security audit
        run: npm audit --omit=dev
      - uses: actions/upload-artifact@v4
        with:
          name: javafy-benchmark-node-${{ matrix.node }}
          path: benchmark-results.json
          if-no-files-found: error
