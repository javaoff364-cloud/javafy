name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript build
        run: npm run build
      - name: Core router tests
        run: npm test
      - name: Example typecheck
        run: npm run typecheck:example
      - name: Example production build
        run: npm run build:example
      - name: Production fullstack smoke tests
        run: node scripts/verify-production.mjs
